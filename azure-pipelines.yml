 trigger:
   - main

 pool:
   vmImage: 'ubuntu-latest'
      
 variables:
   CS_REGISTRY: "registry.crowdstrike.com"
   CS_IMAGE_NAME: "registry.crowdstrike.com/fcs/eu-1/release/cs-fcs"
   CS_USERNAME: "fh-39AECBE16A5D4284B1E412F3AC267D18"
   CS_IMAGE_TAG: 2.1.0
   FALCON_API_URL: "https://api.eu-1.crowdstrike.com"
   FALCON_REGION: "eu-1"
   PROJECT_PATH: "$(Build.Repository.LocalPath)"
   
   SCAN_PATH: "$(Build.Repository.LocalPath)"
   
   CORTEX_API_URL: "https://api-pov-2025-gk4pa.xdr.fa.paloaltonetworks.com"
   MIN_LOG_LEVEL: "DEBUG"
 
 steps:
  - script: |
      echo "Checking branch policies for 'main'..."
      # Prerequisites: System.AccessToken is enabled for the pipeline
      # See: https://docs.microsoft.com/en-us/azure/devops/pipelines/build/variables?view=azure-pipelines
      ORG_URL=$(echo "$(System.CollectionUri)" | sed 's#/$##')
      PROJECT="$(System.TeamProject)"
      REPO_ID="$(Build.Repository.ID)"
      BRANCH_NAME="refs/heads/main"
      API_URL="${ORG_URL}/${PROJECT}/_apis/git/repositories/${REPO_ID}/refs?filter=${BRANCH_NAME}&api-version=7.1-preview.1"

      # Check branch policies
      POLICIES_URL="${ORG_URL}/${PROJECT}/_apis/policy/configurations?repositoryId=${REPO_ID}&refName=${BRANCH_NAME}&api-version=7.1-preview.1"
      POLICIES=$(curl -s -u ":$(System.AccessToken)" "$POLICIES_URL")
      REQUIRED_APPROVALS=$(echo $POLICIES | jq '[.value[] | select(.type.displayName | test("Minimum number of reviewers"))] | length')

      echo "Found $REQUIRED_APPROVALS reviewer policies on 'main'."
      if [ "$REQUIRED_APPROVALS" -lt 1 ]; then
        echo "ERROR: No required reviewer branch policy found on main branch."
        exit 1
      fi
      echo "Branch policies validated."
    displayName: "Validate Branch Policies on Main"
    env:
      System_AccessToken: $(System.AccessToken)
    continueOnError: false

  - script: |
      echo "Verifying that required security scanning steps are present..."
      # We're checking the YAML itself for evidence of security scan steps.
      # We expect at least one of: 'FCS IaC scan', 'Wiz CLI', 'Cortex CLI Code Scan'
      YAML_FILE="azure-pipelines.yml"
      if [ ! -f "$YAML_FILE" ]; then
        YAML_FILE="$(Build.SourcesDirectory)/azure-pipelines.yml"
      fi
      if grep -q -e "FCS IaC scan" -e "Wiz CLI" -e "Cortex CLI Code Scan" "$YAML_FILE"; then
        echo "Security scan steps found in pipeline definition."
      else
        echo "ERROR: No security scan steps found in pipeline YAML."
        exit 1
      fi

  
  # Obtenir le token API et le password du registre
  - script: |
      set -e
      echo "Getting Falcon API Access Token..."      
      export FALCON_ACCESS_TOKEN=$(curl --silent --request POST \
        --header "Content-Type: application/x-www-form-urlencoded" \
        --data-urlencode "client_id=${FALCON_CLIENT_ID}" \
        --data-urlencode "client_secret=${FALCON_CLIENT_SECRET}" \
        --url "${FALCON_API_URL}/oauth2/token" | jq -r '.access_token')

      if [ -z "$FALCON_ACCESS_TOKEN" ] || [ "$FALCON_ACCESS_TOKEN" = "null" ]; then
        echo "Failed to retrieve Falcon API access token"
        echo "$FALCON_ACCESS_TOKEN"
        exit 1
      fi

      echo "Getting CrowdStrike registry password..."
      export CS_PASSWORD=$(curl --silent --request GET \
        --header "Authorization: Bearer ${FALCON_ACCESS_TOKEN}" \
        --url "${FALCON_API_URL}/iac/entities/image-registry-credentials/v1" | jq -r '.resources.resources.token')

      if [ -z "$CS_PASSWORD" ] || [ "$CS_PASSWORD" = "null" ]; then
        echo "Failed to retrieve CrowdStrike registry password"
        exit 1
      fi
      # Pour propager la variable à l’étape suivante
      echo "##vso[task.setvariable variable=CS_PASSWORD]$CS_PASSWORD"
    displayName: 'Get Falcon API Token and Registry Password'
  # Vérification des variables d'environnement requises
  - script: |
      set +x
      scan_status=0
      if [[ -z "$CS_USERNAME" || -z "$CS_PASSWORD" || -z "$CS_REGISTRY" || -z "$CS_IMAGE_NAME" || -z "$CS_IMAGE_TAG" || -z "$FALCON_CLIENT_ID" || -z "$FALCON_CLIENT_SECRET" || -z "$FALCON_REGION" || -z "$PROJECT_PATH" ]]; then
        echo "Error: required environment variables/params are not set"
        exit 1
      fi

      echo "Logging in to crowdstrike registry with username: $CS_USERNAME"
      echo "$CS_PASSWORD" | docker login "$CS_REGISTRY" --username "$CS_USERNAME" --password-stdin

      if [ $? -eq 0 ]; then
        echo "Docker login successful"
        echo "Pulling fcs container target from crowdstrike"
        echo "$CS_IMAGE_NAME"
        echo "$CS_IMAGE_TAG"
        docker pull "$CS_IMAGE_NAME":"$CS_IMAGE_TAG"
        if [ $? -eq 0 ]; then
          echo "fcs docker container image pulled successfully"
          echo "=============== FCS IaC Scan Starts ==============="
          docker run --network=host --rm \
            -v "$PROJECT_PATH":/workspace \
            "$CS_IMAGE_NAME":"$CS_IMAGE_TAG" \
            --client-id "$FALCON_CLIENT_ID" \
            --client-secret "$FALCON_CLIENT_SECRET" \
            --falcon-region "$FALCON_REGION" \
            scan iac \
            --upload \
            --path /workspace \
            --fail-on "critical=10,high=70,medium=50,informational=10" 
          scan_status=$?
          echo "=============== FCS IaC Scan Ends ==============="
          echo "fcs-iac-scan-status: ${scan_status}"
          echo $scan_status > fcs_scan_status.txt
        else
          echo "Error: failed to pull fcs docker image from crowdstrike"
          exit 2
        fi
      else
        echo "Error: docker login failed"
        exit 3
      fi
    displayName: 'Run FCS IaC scan in Docker'

  # Gestion des codes de sortie et marquage du build
  - script: |
      scan_status=$(cat fcs_scan_status.txt)
      echo "Returned scan status: $scan_status"
      if [ "$scan_status" -eq 40 ]; then
        echo "Scan succeeded & vulnerabilities count are ABOVE the '--fail-on' threshold; Pipeline will be marked as SucceededWithIssues."
        echo "vso[task.complete result=SucceededWithIssues;]Scan found vulnerabilities above threshold"
      elif [ "$scan_status" -eq 0 ]; then
        echo "Scan succeeded & vulnerabilities count are BELOW the '--fail-on' threshold; Pipeline will be marked as Success."
      else
        echo "Unexpected scan exit code: $scan_status"
        echo "vso[task.complete result=Failed;]Unexpected scan exit code: $scan_status"
        exit 1
      fi
    displayName: 'Evaluate scan status and mark build'

  # Affichage final (toujours exécuté)
  - script: |
      echo "FCS IaC Scan Execution complete.."
    displayName: 'Always - Scan Complete'




  # Wiz
  - script: |
      echo "##[command]Obtaining WizCLI from the inter-webs..."
      sudo curl -o /usr/bin/wizcli https://downloads.wiz.io/wizcli/latest/wizcli-linux-amd64
      echo "##[command]Making WizCLI executable"
      sudo chmod +x /usr/bin/wizcli
      /usr/bin/./wizcli auth --id $(WIZ_CLIENT_ID2) --secret $(WIZ_CLIENT_SECRET2)
      /usr/bin/./wizcli iac scan --path "$SCAN_PATH"
      /usr/bin/./wizcli dir scan --path "$SCAN_PATH"
    displayName: "Wiz CLI"




  # Cortex Cloud
  - checkout: self
    clean: true
  - task: NodeTool@0
    displayName: "Cortex Cloud CLI"
    inputs:
      versionSpec: "22.x"
  - bash: |
      set -euo pipefail
      sudo apt-get update
      sudo apt-get install -y --no-install-recommends jq ca-certificates curl
      BASE="${CORTEX_API_URL%/}"
      URL="$BASE/public_api/v1/unified-cli/releases/download-link?os=linux&architecture=amd64"
      set +x
      CRTX_URL=$(curl -fsSL "$URL" \
        -H "x-xdr-auth-id: ${CORTEX_API_KEY_ID2}" \
        -H "Authorization: ${CORTEX_API_KEY2}" | jq -r '.signed_url')
      set -x
      curl -fsSL -o cortexcli "$CRTX_URL"
      sudo chmod +x cortexcli
    displayName: "Download cortexcli (amd64)"
    env:
      CORTEX_API_URL: $(CORTEX_API_URL)
      CORTEX_API_KEY_ID2: $(CORTEX_API_KEY_ID2)
      CORTEX_API_KEY2: $(CORTEX_API_KEY2)
  - bash: |
      set -euo pipefail
      ./cortexcli \
        --api-base-url "${CORTEX_API_URL}" \
        --api-key "${CORTEX_API_KEY2}" \
        --api-key-id "${CORTEX_API_KEY_ID2}" \
        code scan \
        --directory "$(Build.SourcesDirectory)" \
        --repo-id "$(Build.Repository.Name)" \
        --branch "$(Build.SourceBranchName)" \
        --source "CORTEX_CLI" \
        --create-repo-if-missing
    displayName: "Cortex CLI Code Scan"
    env:
      CORTEX_API_URL: $(CORTEX_API_URL)
      CORTEX_API_KEY_ID2: $(CORTEX_API_KEY_ID2)
      CORTEX_API_KEY2: $(CORTEX_API_KEY2)
      MIN_LOG_LEVEL: $(MIN_LOG_LEVEL)